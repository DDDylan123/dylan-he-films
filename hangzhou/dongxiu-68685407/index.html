<style>
/* 布局：全宽的三维雾气空间作为舞台，下方一行安静的控制条。单一暖灰纸色调。 */
:root{
  --paper:#ece9e2;
  --fog:#e4e0d7;
  --ink:#161513;
  --muted:#7c776d;
  --line:#d3cec3;
  --seal:#9a3324;
  --display:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
  --body:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 36px;display:grid;gap:12px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:20px;margin:0;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13px}
#stage{position:relative;width:100%;height:min(80vh,780px);min-height:440px;border-radius:3px;overflow:hidden;background:linear-gradient(180deg,#f2f0eb 0%,#ebe8e1 45%,#e2ded5 62%,#dcd7cd 100%);touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
#stage:fullscreen{height:100%;border-radius:0}
.hud{position:absolute;left:14px;right:14px;bottom:10px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.08em;pointer-events:none;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 15px}
button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.g{font-family:var(--display);font-size:15px}
.lbl{color:var(--muted);font-size:12px}
.slider{flex:1 1 220px;display:flex;align-items:center;gap:8px;min-width:0}
input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}
.note{color:var(--muted);font-size:13px;max-width:72ch;border-top:1px solid var(--line);padding-top:12px;margin:0}
.switch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}.switch a{font-size:13px;padding:5px 14px;color:var(--ink);text-decoration:none}.switch a[aria-current="page"]{background:var(--ink);color:var(--paper)}.switch a:focus-visible{outline:2px solid var(--seal);outline-offset:-2px}
</style>

function ridgeTex(seed,rough){

/* 一笔书写的毛笔渲染：沿笔路逐点盖印"笔毫"，压力决定笔宽，墨量决定飞白 */
function makeBrush(stroke,SZ,seed){

  // 方向与曲率

  for(let i=0;i<N;i++){const a=Math.max(0,i-3),b=Math.min(N-1,i+3);let dx=X[b]-X[a],dy=Y[b]-Y[a];const l=Math.hypot(dx,dy)||1;TX[i]=dx/l;TY[i]=dy/l}

        const o=off[b]*2*w*(0.92+0.08*Math.sin(i*0.05+ph[b]))/(1+K[i]*2.5);
        g.globalAlpha=Math.min(0.85,0.25+ink*0.7);
        g.beginPath();g.arc(X[i]+nx*o,Y[i]+ny*o,Math.max(0.6,w/NB*3.4),0,6.283);g.fill();
      }
    }
    drawn=target+1;g.globalAlpha=1;
    return i2xy(target);
  }
  function i2xy(i){return [X[Math.min(i,N-1)],Y[Math.min(i,N-1)]]}
  function reset(){drawn=0}
  return {draw,reset};
}

const STROKES=JSON.parse(document.getElementById('strokes').textContent);
const S=1024;
function makeGlyph(key,seed){
  const out=document.createElement('canvas');out.width=out.height=S;const g=out.getContext('2d');g.fillStyle='#100f0e';
  const tex=new THREE.CanvasTexture(out);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
  const sh=document.createElement('canvas');sh.width=sh.height=256;const sg=sh.getContext('2d');
  const stex=new THREE.CanvasTexture(sh);stex.colorSpace=THREE.SRGBColorSpace;
  return {B:makeBrush(STROKES[key],S,seed),g,tex,out,sg,stex,last:-1};
}
function paint(G,p){
  if(p===G.last)return;
  if(p<G.last){G.g.clearRect(0,0,S,S);G.B.reset()}
  G.last=p;if(p<=0){G.tex.needsUpdate=true;G.sg.clearRect(0,0,256,256);G.stex.needsUpdate=true;return}
  G.B.draw(G.g,p);G.tex.needsUpdate=true;
  const sg=G.sg;sg.clearRect(0,0,256,256);sg.filter='blur(7px)';sg.drawImage(G.out,14,14,228,228);sg.filter='none';G.stex.needsUpdate=true;
}
const SIZE=3.3;const FLOOR_Y=-2.05;
function makeCard(){
  const geo=new THREE.PlaneGeometry(SIZE,SIZE);
  const mat=new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,fog:false});
  const mesh=new THREE.Mesh(geo,mat);mesh.renderOrder=2;
  const shadow=new THREE.Mesh(new THREE.PlaneGeometry(SIZE*1.1,SIZE*0.55),new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,opacity:0.3,color:0x2a241c,fog:true}));
  shadow.rotation.x=-Math.PI/2;shadow.position.y=-2.05;shadow.renderOrder=-1;mesh.userData.shadow=shadow;scene.add(shadow);
  scene.add(mesh);return mesh;
}
const cards={dong:makeCard(),xiu:makeCard()};
const glyphs={dong:makeGlyph('dong',11),xiu:makeGlyph('xiu',29)};

let mode='both';
const LAYOUT={
  both:{dong:[-1.45,0.1,0.4,0.18],xiu:[1.5,0,-0.6,-0.16]},
  dong:{dong:[0,0,0,0.08]},xiu:{xiu:[0,0,0,-0.08]}
};
function bind(){
  for(const n of ['dong','xiu']){
    const G=glyphs[n];const c=cards[n];
    c.material.map=G.tex;c.material.needsUpdate=true;
    const sh=c.userData.shadow;sh.material.map=G.stex;sh.material.needsUpdate=true;
    const L=LAYOUT[mode][n];c.visible=!!L;sh.visible=!!L;
    if(L){sh.position.x=L[0]-0.25;sh.position.z=L[2]-0.7;sh.rotation.z=-L[3]}
    if(L){c.position.set(L[0],L[1],L[2]);c.rotation.y=L[3];c.userData.base=L.slice()}
  }
}
bind();

/* 书写节奏：每个字 4.6 秒，起收慢、行笔快 */
const DUR=5.2,GAP=0.6,HOLD=3;
const seq=()=>mode==='both'?['dong','xiu']:[mode];
const total=()=>seq().length*DUR+(seq().length-1)*GAP;
const ease=x=>{x=Math.min(1,Math.max(0,x));return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const slow=x=>0.35*ease(x)+0.65*Math.min(1,Math.max(0,x));
let t=0,playing=true;
const slider=document.getElementById('progress'),pct=document.getElementById('pct'),label=document.getElementById('label'),playBtn=document.getElementById('play');
function apply(tt){
  const s=seq();let anyP=0;
  s.forEach((n,i)=>{const st=i*(DUR+GAP);const p=slow((tt-st)/DUR);paint(glyphs[n],Math.min(1,Math.max(0,p)))});
  const P=Math.min(1,tt/total());slider.value=Math.round(P*1000);pct.textContent=Math.round(P*100)+'%';
}
function setPlaying(v){playing=v;playBtn.textContent=v?'暂停':'播放';playBtn.setAttribute('aria-pressed',v)}
playBtn.addEventListener('click',()=>{if(!playing&&t>=total())t=0;setPlaying(!playing)});
slider.addEventListener('input',()=>{setPlaying(false);t=slider.value/1000*total();apply(t)});
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.m;
  document.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  label.textContent={both:'东 · 秀',dong:'东',xiu:'秀'}[mode];bind();t=0;setPlaying(true)}));
document.getElementById('fs').addEventListener('click',()=>{try{
  if(document.fullscreenElement)document.exitFullscreen();
  else{const r=(stage.requestFullscreen||stage.webkitRequestFullscreen)?.call(stage);r&&r.catch&&r.catch(()=>{})}}catch(e){}});

function fit(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w/h<0.9?46:32;camera.updateProjectionMatrix()}
new ResizeObserver(fit).observe(stage);fit();

/* 镜头：缓慢游移 + 指针视差，拖动时让位给手动 */
let interacting=false,idle=0;
controls.addEventListener('start',()=>{interacting=true});controls.addEventListener('end',()=>{interacting=false;idle=0});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new THREE.Clock();let et=0;
function loop(){
  const dt=Math.min(clock.getDelta(),0.05);et+=dt;
  if(playing){t+=dt;if(t>total()+HOLD)t=0}
  apply(Math.min(t,total()));
  if(!reduce){
    for(const n of ['dong','xiu']){const c=cards[n],b=c.userData.base;if(!b)continue;
      const ph=n==='dong'?0:1.7;c.position.y=b[1]+Math.sin(et*0.6+ph)*0.06;c.rotation.y=b[3]+Math.sin(et*0.35+ph)*0.05}
    mists.forEach(m=>{m.position.x+=m.userData.v*dt;if(m.position.x>8)m.position.x=-8;m.material.opacity=m.userData.base*(0.75+0.25*Math.sin(et*0.2+m.userData.ph))});
    dots.material.uniforms.t.value=et;
    idle+=dt;
    if(!interacting&&idle>2.5){const a=Math.sin(et*0.12)*0.38,r=8.8;
      camera.position.lerp(new THREE.Vector3(Math.sin(a)*r,1.0+Math.sin(et*0.09)*0.4,Math.cos(a)*r),0.02)}
  }
  controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
