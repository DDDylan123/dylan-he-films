<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>参考片连播</title>
<style>
:root{--bg:#f5f2eb;--card:#fffdf8;--ink:#23252a;--mute:#6f7479;--line:#e3ddd0;--red:#b8382c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1e2125;--ink:#ece6d8;--mute:#9ba1a6;--line:#30353b;--red:#e0675a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;padding:20px 16px 50px;font:15px/1.6 "Songti SC","STSong","Noto Serif SC","SimSun",serif}
.w{max-width:960px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:20px;letter-spacing:.12em;margin:0}
.top a{font-size:13px;color:var(--mute)}
.v{position:relative;aspect-ratio:16/9;background:#000;margin:14px 0 10px;border-radius:4px;overflow:hidden}
.v>div,.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.err{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#ddd;text-align:center;padding:20px;font-size:14px}
.err a{color:#fff;background:var(--red);padding:6px 14px;border-radius:3px;text-decoration:none}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:3px;padding:6px 14px;cursor:pointer}
.bar button.p{background:var(--red);border-color:var(--red);color:#fff}
#now{flex:1 1 100%;font-size:16px}
#now em{font-style:normal;color:var(--red);font-family:ui-monospace,Menlo,monospace;font-size:13px;margin-right:.4em}
.bar label{font-size:13px;color:var(--mute)}
ol{list-style:none;padding:0;margin:16px 0 0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
li button{all:unset;box-sizing:border-box;display:flex;gap:10px;width:100%;padding:9px 6px;cursor:pointer;font-size:14.5px}
li button span{color:var(--mute);font-family:ui-monospace,Menlo,monospace;font-size:12.5px;min-width:1.8em;padding-top:2px}
li button:hover,li.on button{color:var(--red)}
li.on{background:var(--card)}
.tip{font-size:12.5px;color:var(--mute);margin-top:14px}
</style>
</head>
<body>
<div class="w">
<div class="top"><h1>参考片连播</h1><a href="../">← 返回参考片单</a></div>
<div class="v"><div id="pl"></div><div class="err" id="err"><span>该视频不允许在其他网站内嵌播放</span><a id="errA" target="_blank" rel="noopener">在 YouTube 打开</a></div></div>
<div class="bar">
<div id="now"></div>
<button id="prev">上一个</button><button id="next" class="p">下一个</button>
<label><input type="checkbox" id="auto" checked> 自动连播</label>
</div>
<ol id="list"></ol>
<p class="tip">需能访问 YouTube 的网络。少数视频若不允许内嵌，会提示改在 YouTube 打开，点“下一个”继续。</p>
</div>
<script>
var V=[["3P1CnWI62Ik","Feel the Rhythm of Korea"],["gqYzEv_AqYM","JAPAN – Where tradition meets the future"],["XpPwj5kU9rg","台北时装周 AW23 宣传片"],["SWmXufBxD9c","韩服浪潮 Hanbok Wave"],["mwehcPQUC3g","Chanel × Wim Wenders《从巴黎到杭州》"],["960LY54BbbQ","KENZO 2023 秋冬《京都与大阪》"],["Kz7e-Q2Q9-4","Kaguya by Gucci《辉夜姬》"],["elQNnkDG1ik","Chanel《Tokyo Trip》"],["uMnlNw7QTjM","Saint Laurent《A Night in Shanghai》"]];
var i=0,P,ready=false,$=function(x){return document.getElementById(x)};
var m=location.hash.match(/^#(\d+)$/);if(m)i=Math.min(V.length-1,Math.max(0,m[1]-1));
V.forEach(function(v,k){var li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>';b.appendChild(document.createTextNode(v[1]));b.onclick=function(){go(k,1)};li.appendChild(b);$('list').appendChild(li)});
function ui(){var l=$('list').children;for(var k=0;k<l.length;k++)l[k].className=k==i?'on':'';$('now').innerHTML='<em>'+(i+1)+' / '+V.length+'</em>';$('now').appendChild(document.createTextNode(V[i][1]));$('err').style.display='none';$('errA').href='https://www.youtube.com/watch?v='+V[i][0];history.replaceState(null,'','#'+(i+1))}
function go(k,play){i=(k+V.length)%V.length;ui();if(ready){play?P.loadVideoById(V[i][0]):P.cueVideoById(V[i][0])}}
$('prev').onclick=function(){go(i-1,1)};$('next').onclick=function(){go(i+1,1)};
ui();
window.onYouTubeIframeAPIReady=function(){P=new YT.Player('pl',{videoId:V[i][0],playerVars:{rel:0,playsinline:1,modestbranding:1},events:{onReady:function(){ready=true},onStateChange:function(e){if(e.data===0&&$('auto').checked&&i<V.length-1)go(i+1,1)},onError:function(){$('err').style.display='flex'}}})};
var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=function(){$('err').querySelector('span').textContent='无法连接 YouTube，请检查网络';$('err').style.display='flex'};document.head.appendChild(s);
</script>
</body>
</html>
