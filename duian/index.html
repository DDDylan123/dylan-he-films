<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>对岸 THE OTHER SHORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one 2.39:1 film frame centred on black; everything (subs, choices, HUD) lives inside the frame like a print. */
:root{
  --night:#07080a; --frame:#000; --paper:#efe6d6; --dim:#9c9387;
  --flame:#e9a54f; --ember:#b8562b; --line:rgba(239,230,214,.22);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --latin:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--serif);margin:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding-inline:0}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:min(100vw,calc(100dvh * 2.39));aspect-ratio:2.39/1;max-width:100%;max-height:100%;
  background:var(--frame);overflow:hidden;container-type:inline-size;cursor:pointer}
.layer{box-sizing:border-box;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#still{opacity:0;transition:opacity .9s ease;transform-origin:50% 50%}
#still.on{opacity:1}
#still.kb0{animation:kb0 var(--kb,8s) linear forwards}
#still.kb1{animation:kb1 var(--kb,8s) linear forwards}
@keyframes kb0{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.10) translate(-1.2%,-.8%)}}
@keyframes kb1{from{transform:scale(1.10) translate(1%,.6%)}to{transform:scale(1.03) translate(0,0)}}
#vid{opacity:0;transition:opacity .5s ease;background:#000}
#vid.on{opacity:1}
#ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;opacity:0;transition:opacity .8s;
  background:radial-gradient(ellipse at 50% 60%,#1a1612 0%,#08080a 70%);text-align:center;padding-inline:8cqw}
#ph.on{opacity:1}
#ph .tag{font-size:1.1cqw;letter-spacing:.4em;color:var(--flame);border:1px solid var(--flame);padding:.3cqw .9cqw}
#ph .desc{font-size:2.1cqw;color:var(--dim);line-height:1.6}
#cardtxt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;background:#000;opacity:0;transition:opacity 1s;text-align:center;padding-inline:14cqw}
#cardtxt.on{opacity:1}
#cardtxt .zh{font-size:2.3cqw;line-height:1.9;letter-spacing:.14em;white-space:pre-line;text-wrap:balance}
#cardtxt .en{font-family:var(--latin);font-style:italic;font-size:1.5cqw;line-height:1.5;color:var(--dim);white-space:pre-line}
#grain{pointer-events:none;mix-blend-mode:overlay;opacity:.35}
#vignette{pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{pointer-events:none;background:radial-gradient(circle at 50% 70%,rgba(233,165,79,.55),transparent 60%);opacity:0;transition:opacity .6s}
#flash.on{opacity:1;transition:opacity .05s}

#year{position:absolute;left:2.4cqw;top:1.8cqw;font-family:var(--latin);font-style:italic;font-size:1.7cqw;letter-spacing:.12em;color:var(--paper);opacity:.75;font-variant-numeric:tabular-nums}
#box.off{opacity:0}
#box{transition:opacity .8s;position:absolute;right:2.4cqw;top:1.8cqw;display:flex;align-items:flex-end;gap:.32cqw;height:2.2cqw}
#box i{display:block;width:.28cqw;height:2cqw;background:linear-gradient(to bottom,var(--ember) 0 22%,#d9c3a0 22%);border-radius:.14cqw .14cqw 0 0;transition:opacity .6s,transform .6s}
#box i.burnt{opacity:.15;transform:translateY(.5cqw)}
#need{position:absolute;right:2.4cqw;top:4.6cqw;font-size:1cqw;color:var(--flame);letter-spacing:.08em;opacity:.85}

#subs{position:absolute;left:0;right:0;bottom:3.2cqw;text-align:center;padding-inline:10cqw;pointer-events:none;
  text-shadow:0 0 .4cqw rgba(0,0,0,.9),0 .1cqw .2cqw #000}
#subs .zh{font-size:2.15cqw;line-height:1.55;letter-spacing:.06em;color:#f3e7c9;text-wrap:balance}
#subs .mid{font-size:1.75cqw;line-height:1.5;letter-spacing:.06em;color:#e4d8bf;margin-top:.2cqw}
#subs .en{font-family:var(--latin);font-size:1.55cqw;font-style:italic;color:#d7ccb8;margin-top:.3cqw}
#subs{opacity:0;transition:opacity .5s}
#subs.on{opacity:1}

/* choice */
#choice{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2cqw;padding-bottom:5cqw;
  background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.15) 65%,transparent);opacity:0;pointer-events:none;transition:opacity .8s;cursor:default}
#choice.on{opacity:1;pointer-events:auto}
#choice .q{font-size:2.4cqw;letter-spacing:.12em}
#choice .qen{font-family:var(--latin);font-style:italic;font-size:1.5cqw;color:var(--dim);margin-top:-1.4cqw}
#opts{display:flex;gap:3cqw;flex-wrap:wrap;justify-content:center}
.opt{position:relative;background:none;border:0;color:var(--paper);font-family:var(--serif);cursor:pointer;padding:1cqw 1.6cqw 1cqw 3.4cqw;text-align:left;
  border-bottom:1px solid var(--line);transition:border-color .3s,color .3s}
.opt::before{content:"";position:absolute;left:.6cqw;top:50%;width:2cqw;height:.3cqw;transform:translateY(-50%);
  background:linear-gradient(to right,#d9c3a0 78%,var(--ember) 78%);border-radius:0 .15cqw .15cqw 0}
.opt b{display:block;font-weight:600;font-size:2.05cqw;letter-spacing:.1em}
.opt span{display:block;font-family:var(--latin);font-style:italic;font-size:1.35cqw;color:var(--dim)}
.opt:hover,.opt:focus-visible{border-color:var(--flame);color:#fff;outline:none}
.opt:hover::before,.opt:focus-visible::before{background:linear-gradient(to right,#d9c3a0 70%,var(--flame) 70%);box-shadow:1.3cqw 0 1cqw rgba(233,165,79,.55)}

/* cards: title & ending */
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;
  background:rgba(4,4,6,.9);opacity:0;pointer-events:none;transition:opacity 1s;cursor:default;text-align:center}
.card.on{opacity:1;pointer-events:auto}
.title{font-weight:900;font-size:8cqw;letter-spacing:.5em;margin-right:-.5em;line-height:1}
.subtitle{font-family:var(--latin);font-size:1.8cqw;letter-spacing:.6em;color:var(--dim);margin-right:-.6em}
.credit{font-size:1.1cqw;letter-spacing:.3em;color:var(--dim)}
.btnrow{display:flex;gap:2cqw;flex-wrap:wrap;justify-content:center;margin-top:1cqw}
.btn{background:none;border:1px solid var(--line);color:var(--paper);font-family:var(--serif);font-size:1.5cqw;letter-spacing:.25em;
  padding:.8cqw 2.4cqw;cursor:pointer;transition:border-color .3s,background .3s}
.btn:hover,.btn:focus-visible{border-color:var(--flame);background:rgba(233,165,79,.08);outline:none}
.gallery{display:flex;gap:1.6cqw;margin-top:1cqw}
.slot{width:12cqw;border-top:1px solid var(--line);padding-top:.7cqw;font-size:1.25cqw;color:#4d4842;letter-spacing:.1em}
.slot.got{color:var(--paper);border-color:var(--flame)}
.slot small{display:block;font-family:var(--latin);font-style:italic;font-size:1cqw;color:var(--dim)}
.endno{font-family:var(--latin);font-style:italic;font-size:1.6cqw;color:var(--flame);letter-spacing:.2em}
.endname{font-weight:900;font-size:6cqw;letter-spacing:.3em;margin-right:-.3em}
.endline{font-size:1.7cqw;color:var(--paper);letter-spacing:.08em}
#lampBtn{position:relative;background:none;border:0;color:var(--dim);font-family:var(--serif);font-size:1.15cqw;letter-spacing:.3em;cursor:pointer;padding:.6cqw 1cqw .6cqw 3.4cqw}
#lampBtn::before{content:"";position:absolute;left:.6cqw;top:50%;width:2cqw;height:.3cqw;transform:translateY(-50%);background:linear-gradient(to right,#d9c3a0 78%,var(--ember) 78%);border-radius:0 .15cqw .15cqw 0}
#lampBtn:hover,#lampBtn:focus-visible{color:var(--paper);outline:none}
#lampBtn:hover::before,#lampBtn:focus-visible::before{background:linear-gradient(to right,#d9c3a0 70%,var(--flame) 70%);box-shadow:1.3cqw 0 1cqw rgba(233,165,79,.55)}
.endmeta{font-size:1.2cqw;color:var(--dim);letter-spacing:.12em;font-variant-numeric:tabular-nums}
label.notes{font-size:1.1cqw;color:var(--dim);letter-spacing:.1em;display:flex;gap:.6cqw;align-items:center;cursor:pointer}
#hint{position:absolute;bottom:1cqw;right:2.4cqw;font-size:.95cqw;color:var(--dim);opacity:.6;letter-spacing:.1em}
#pauseBtn{position:absolute;left:2.4cqw;bottom:1.2cqw;background:none;border:1px solid var(--line);color:var(--paper);
  font-family:var(--serif);font-size:1.1cqw;letter-spacing:.2em;padding:.35cqw 1cqw;cursor:pointer;opacity:.7;transition:opacity .3s,border-color .3s;display:flex;gap:.5cqw;align-items:center}
#pauseBtn:hover,#pauseBtn:focus-visible{opacity:1;border-color:var(--flame);outline:none}
#pauseBtn svg{width:1cqw;height:1cqw}
#frame.paused #still,#frame.paused #grain{animation-play-state:paused}
#pausecard .ptitle{font-weight:600;font-size:3.2cqw;letter-spacing:.5em;margin-right:-.5em}
#pausecard .where{font-size:1.2cqw;color:var(--dim);letter-spacing:.15em}
#pausecard .btnrow{flex-direction:column;align-items:stretch;gap:1cqw;min-width:22cqw}
#pausecard .keys{font-size:1cqw;color:var(--dim);letter-spacing:.1em}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.2cqw;letter-spacing:.4em;color:var(--dim);opacity:0;transition:opacity .4s;pointer-events:none}
#loading.on{opacity:1;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#still.kb0,#still.kb1{animation:none}}
</style>
</head>
<body>

<div id="wrap"><div id="frame" aria-live="polite">
  <img id="still" class="layer" alt="">
  <video id="vid" class="layer" playsinline preload="auto"></video>
  <div id="ph" class="layer"><div class="tag">待补静帧</div><div class="desc"></div></div>
  <div id="cardtxt" class="layer"><div class="zh"></div><div class="en"></div></div>
  <canvas id="grain" class="layer"></canvas>
  <div id="vignette" class="layer"></div>
  <div id="flash" class="layer"></div>
  <div id="year"></div>
  <div id="box" aria-label="火柴"></div>
  <div id="need"></div>
  <div id="subs"><div class="zh"></div><div class="mid"></div><div class="en"></div></div>
  <div id="loading">加载中</div>
  <div id="hint">点击画面继续 · 空格 / P 暂停</div>
  <button id="pauseBtn" hidden aria-label="暂停"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="3" height="8" fill="currentColor"/><rect x="6" y="1" width="3" height="8" fill="currentColor"/></svg>暂停</button>

  <div id="choice"><div class="q"></div><div class="qen"></div><div id="opts"></div></div>

  <div id="titlecard" class="card on">
    <div class="title">对岸</div>
    <div class="subtitle">THE OTHER SHORE</div>
    <div class="credit">一部互动影像 · 出品人 Dylan He</div>
    <div class="btnrow"><button class="btn" id="startBtn">划一根火柴，开始</button></div>
    <div class="gallery" id="gal1"></div>
    <button id="lampBtn" hidden>一根没用过的火柴</button>
    <label class="notes"><input type="checkbox" id="notesChk" checked> 显示制作备注（缺的素材和待配台词）</label>
  </div>

  <div id="pausecard" class="card" role="dialog" aria-label="暂停">
    <div class="ptitle">暂停</div>
    <div class="where"></div>
    <div class="btnrow">
      <button class="btn" id="resumeBtn">继续</button>
      <button class="btn" id="pBackBtn">回到上一个选择</button>
      <button class="btn" id="pTitleBtn">回到标题</button>
    </div>
    <label class="notes"><input type="checkbox" id="pNotesChk"> 显示制作备注</label>
    <div class="keys">继续：空格 / P / Esc　·　跳过这一格：点击画面 / →</div>
  </div>

  <div id="endcard" class="card">
    <div class="endno"></div>
    <div class="endname"></div>
    <div class="endline"></div>
    <div class="endmeta"></div>
    <div class="gallery" id="gal2"></div>
    <div class="btnrow">
      <button class="btn" id="backBtn">回到上一个选择</button>
      <button class="btn" id="againBtn">从头再来</button>
    </div>
  </div>
</div></div>

<script>
const STORY = {"start": "prologue", "nodes": {"prologue": {"year": "2016", "music": "m/45.mp3", "shots": [{"t": "card", "text": "一九九〇年，浦东开发。\n在那以前，上海人讲：宁要浦西一张床，不要浦东一间房。", "en": "1990: Pudong opens for development. Before that, Shanghai people said:\n“Better a bed in Puxi than a flat in Pudong.”", "dur": 6}, {"t": "vid", "src": "m/00.mp4", "sub": "江两边的灯，我数了二十五年。", "en": "The lights on both banks — I counted them for twenty-five years.", "who": "旁白", "line": "江两边个灯，我数了廿五年。", "need": "待配音·旁白"}, {"t": "vid", "src": "m/01.mp4", "sub": "一九九一年三月，晚上九点。浦东的灯，一盏一盏，数得清。", "en": "March 1991, nine at night. The lights of Pudong — you could still count them, one by one.", "who": "旁白", "line": "一九九一年三月，夜里向九点钟。浦东个灯，一盏一盏，数得清。", "need": "待配音·旁白", "year": "1991"}], "next": "k1"}, "k1": {"year": "1991", "music": "m/45.mp3", "shots": [{"t": "ph", "desc": "灶间，两只碗，一只还冒着热气（1991，老平房）", "dur": 4.5, "sub": "吃了饭再走，外面风大得很。", "en": "Eat first, then go. The wind’s fierce out there.", "who": "老金", "line": "吃仔饭再去，外头 hong 大来邪。", "vo": "m/48.mp3", "need": "待补静帧"}, {"t": "ph", "desc": "灶间，两只碗，一只还冒着热气（1991，老平房）", "dur": 4.5, "sub": "老金是我师傅。我十六岁起跟着他过，跟他学修自行车。", "en": "Lao Jin was my master. From sixteen I lived with him and learned to fix bicycles.", "who": "旁白", "line": "老金是我师傅。我十六岁起跟伊过，跟伊学修脚踏车。", "need": "待补静帧；待配音·旁白"}, {"t": "ph", "desc": "灶间，两只碗，一只还冒着热气（1991，老平房）", "dur": 4.5, "sub": "我爸死的那年，我妈过江改嫁。走的时候说，过两个月来接我。", "en": "The year my father died, my mother crossed the river to remarry. She said she’d come for me in two months.", "who": "旁白", "line": "爷死脱那年，姆妈过江嫁人，临走讲，过两个号头来接我。", "need": "待补静帧；待配音·旁白"}, {"t": "ph", "desc": "灶间，两只碗，一只还冒着热气（1991，老平房）", "dur": 4.5, "sub": "我爸给我留了一间平房，就在老金隔壁。", "en": "My father left me a one-storey house, right next door to Lao Jin.", "who": "旁白", "line": "爷留拨我一间平房，就辣老金隔壁。", "need": "待补静帧；待配音·旁白"}, {"t": "ph", "desc": "灶间，两只碗，一只还冒着热气（1991，老平房）", "dur": 3.5, "sub": "我等到今天。", "en": "I’m still waiting.", "who": "旁白", "line": "我等到今朝。", "need": "待补静帧；待配音·旁白"}, {"t": "ph", "desc": "修车摊，老金把着阿乔的手补胎", "dur": 4.5, "sub": "修修还能用的。", "en": "Patch it up. It still works.", "who": "老金", "line": "修修还好用格。", "vo": "m/49.mp3", "need": "待补静帧"}, {"t": "ph", "desc": "灶头上，老金把一盒自来火塞进阿乔口袋", "dur": 4.5, "sub": "夜里冷，这盒火柴拿去。", "en": "It’s cold at night. Take these matches.", "who": "老金", "line": "夜里冷，迭盒自来火拿去。", "vo": "m/50.mp3", "need": "待补静帧", "box": true}, {"t": "ph", "desc": "灶头上，老金把一盒自来火塞进阿乔口袋", "dur": 4.5, "sub": "他不知道，我每天晚上跑到江边，是去数对岸的灯。", "en": "He didn’t know that every night I went down to the river to count the lights on the other side.", "who": "旁白", "line": "伊不晓得，我每夜跑到江边，是去数对岸个灯。", "need": "待补静帧；待配音·旁白"}], "next": "c1"}, "c1": {"year": "1991", "music": "m/45.mp3", "shots": [{"t": "img", "src": "m/02.webp", "dur": 4.5, "sub": "末班轮渡前，一个浦西女人走过来。", "en": "Before the last ferry, a woman from Puxi walked over.", "who": "旁白", "line": "末班轮渡前，一个浦西女人走过来。", "need": "待配音·旁白"}, {"t": "img", "src": "m/03.webp", "dur": 4.5, "sub": "有火吗？", "en": "“Got a light?”", "who": "薇薇", "line": "有火伐？", "need": "待配音·薇薇"}], "choice": {"q": "火一亮，你看得见她；她也看得见你。", "qen": "Strike a light and you will see her — and she will see you.", "opts": [{"l": "划一根自来火", "en": "Strike a match", "to": "n1a", "set": "met", "burn": 1}, {"l": "讲：呒没", "en": "“I don’t have one.”", "to": "n1b"}]}}, "n1a": {"year": "1991", "music": "m/45.mp3", "shots": [{"t": "img", "src": "m/04.webp", "dur": 4.5, "sub": "我借给她一根火柴。", "en": "I gave her a match.", "who": "旁白", "line": "我借拨伊一根自来火。", "need": "待配音·旁白"}, {"t": "img", "src": "m/05.webp", "dur": 4.5, "sub": "火光里，我第一次看清她的脸。", "en": "In the flare, I saw her face clearly for the first time.", "who": "旁白", "line": "火光里，我第一趟看清爽伊个面孔。", "need": "待配音·旁白"}, {"t": "img", "src": "m/06.webp", "dur": 4.5, "sub": "她上了船。", "en": "She got on the boat.", "who": "旁白", "line": "伊上了船。", "need": "待配音·旁白"}, {"t": "vid", "src": "m/07.mp4", "sub": "从那以后，对岸有了一个人。", "en": "From then on, there was someone on the other shore.", "who": "旁白", "line": "从此以后，对岸有了一个人。", "need": "待配音·旁白"}], "next": "c2"}, "n1b": {"year": "1991", "music": "m/45.mp3", "shots": [{"t": "ph", "desc": "她转身走开，向别人借火（背影）", "dur": 4.5, "sub": "我说，没有。", "en": "“No,” I said.", "who": "旁白", "line": "我讲，呒没。", "need": "待补静帧；待配音·旁白"}, {"t": "ph", "desc": "她转身走开，向别人借火（背影）", "dur": 4.5, "sub": "火柴在我口袋里，一根也没少。", "en": "The matches stayed in my pocket. Not one missing.", "who": "旁白", "line": "自来火辣我袋袋里，一根也没少。", "need": "待补静帧；待配音·旁白"}, {"t": "vid", "src": "m/08.mp4", "sub": "对岸，还是对岸。", "en": "The other shore was still the other shore.", "who": "旁白", "line": "对岸，还是对岸。", "need": "待配音·旁白"}], "next": "c2"}, "c2": {"year": "1992", "music": "m/46.mp3", "shots": [{"t": "vid", "src": "m/09.mp4", "sub": "一九九二年，动迁的消息来了。江上已经有了桥，人心里的江，还没有。", "en": "1992. Word of the demolitions came. There was a bridge over the river now — but not over the one in people’s heads.", "who": "旁白", "line": "一九九二年，动迁个消息来了。江上头已经有了桥，人心里向个江，还没。", "need": "待配音·旁白"}, {"t": "vid", "src": "m/10.mp4", "sub": "量到哪里，算到哪里。", "en": "“Whatever we measure is what you get.”", "who": "老张（公事，市区腔）"}, {"t": "img", "src": "m/11.webp", "dur": 4.5, "sub": "一夜之间，隔壁人家的屋顶上，长出了楼。", "en": "Overnight, extra floors sprouted on the neighbours’ roofs.", "who": "旁白", "line": "一夜之间，隔壁人家个屋顶上，长出了楼。", "need": "待配音·旁白"}, {"t": "ph", "desc": "门口，老张私下跟老金说话，阿乔在旁边（1992）", "dur": 4.5, "sub": "老金，你也加一层，不加吃亏的。", "en": "“Lao Jin, add a floor too. You lose out if you don’t.”", "who": "老张（私下，浦东话）", "line": "老金，侬也加一层，弗加吃亏格。", "need": "待补静帧；浦东话生成中（L7）；待配音·老张（私下，浦东话）"}, {"t": "ph", "desc": "门口，老张私下跟老金说话，阿乔在旁边（1992）", "dur": 4.5, "sub": "不是我们的，拿了夜里睡不着。", "en": "“It isn’t ours. Take it and you won’t sleep at night.”", "who": "老金", "line": "弗是吾伲格，拿仔夜里困弗着。", "need": "待补静帧；浦东话待生成（L5，写作“五泥”）；待配音·老金"}, {"t": "ph", "desc": "门口，老张私下跟老金说话，阿乔在旁边（1992）", "dur": 3.5, "sub": "你加吗？", "en": "“Are you adding one?”", "who": "老金（转向阿乔）", "line": "侬加伐？", "need": "待补静帧；浦东话待选（L6）；待配音·老金（转向阿乔）"}], "choice": {"q": "多一层，多一套房。也多一夜困弗着。", "qen": "One more floor, one more flat. And one more sleepless night.", "opts": [{"l": "加，连夜加楼", "en": "Build, tonight", "to": "n2a"}, {"l": "勿加，跟老金一样", "en": "Don’t, like Lao Jin", "to": "n2b"}]}}, "n2a": {"year": "1992–1994", "music": "m/46.mp3", "shots": [{"t": "vid", "src": "m/12.mp4", "sub": "加。", "en": "“Build.”", "who": "年轻阿乔（浦东话）", "line": "加。", "need": "浦东话待生成（L8）；待配音·年轻阿乔（浦东话）"}, {"t": "vid", "src": "m/13.mp4", "sub": "老板，三层要加钢筋，不然要塌的。", "en": "“Boss, three floors needs rebar, or it’ll come down.”", "who": "小陈（苏北口音普通话）", "line": "老板，三层要加钢筋，不然要塌的。", "need": "待配音·小陈（苏北口音普通话）"}, {"t": "vid", "src": "m/14.mp4", "sub": "两年里，我加了三层。楼是假的，钢筋是真的。", "en": "In two years I added three floors. The floors were fake. The rebar was real.", "who": "旁白", "line": "两年里向，我加了三层。楼是假个，钢筋是真个。", "need": "待配音·旁白"}, {"t": "vid", "src": "m/15.mp4", "sub": "", "en": ""}, {"t": "vid", "src": "m/16.mp4", "sub": "老房子拆了，分到四套新房子。", "en": "The old house came down. I got four new flats.", "who": "旁白", "line": "老屋拆脱，分到四套新房子。", "need": "待配音·旁白"}], "next": "c3"}, "n2b": {"year": "1994", "music": "m/45.mp3", "shots": [{"t": "vid", "src": "m/31.mp4", "sub": "我跟老金一样，一层也没加。", "en": "Like Lao Jin, I didn’t add a single floor.", "who": "旁白", "line": "我跟老金一样，一层也没加。", "need": "待配音·旁白"}, {"t": "img", "src": "m/32.webp", "dur": 4.5, "sub": "一九九四年，搬进新村。一套，新的。", "en": "1994. We moved into the new estate. One flat. Brand new.", "who": "旁白", "line": "一九九四年，搬进新村。一套，新个。", "need": "史实修正：画面要改成新建的新村；待配音·旁白"}, {"t": "vid", "src": "m/33.mp4", "sub": "隔壁就是老金。我家没装灶，晚饭还是跟他一起吃。", "en": "Lao Jin was next door. I never put in a stove; I still ate dinner at his.", "who": "旁白", "line": "隔壁就是老金。我屋里没装灶，夜饭还是搭伊吃。", "need": "待配音·旁白"}], "next": "c5"}, "c3": {"year": "1994", "music": "m/45.mp3", "shots": [{"t": "img", "src": "m/17.webp", "dur": 4.5, "sub": "四把钥匙。每一把，都开一扇浦东的门。", "en": "Four keys. Every one of them opened a door in Pudong.", "who": "旁白", "line": "四把钥匙。每一把，都开一扇浦东个门。", "need": "待配音·旁白"}, {"t": "img", "src": "m/18.webp", "dur": 3.5, "sub": "怎么还是浦东。", "en": "And still — Pudong.", "who": "旁白", "line": "哪能还是浦东。", "need": "待配音·旁白"}, {"t": "img", "src": "m/19.webp", "dur": 4.5, "sub": "那边有什么好？", "en": "“What’s so good over there?”", "who": "老金", "line": "依 be be 有啥好？", "vo": "m/51.mp3"}], "choice": {"q": "四扇门，都在你身后。", "qen": "Four doors, all of them behind you.", "opts": [{"l": "统统卖脱，过江", "en": "Sell them all, cross the river", "to": "n3a"}, {"l": "留在浦东", "en": "Stay in Pudong", "to": "e3"}]}}, "n3a": {"year": "1995", "music": "m/45.mp3", "shots": [{"t": "vid", "src": "m/21.mp4", "sub": "我一天也没住过，晚上还是睡在老金家。全部卖掉，去买了浦西。", "en": "I never spent a night in them — I still slept at Lao Jin’s. I sold the lot and bought in Puxi.", "who": "旁白", "line": "我一日也没住过，夜里还是困辣老金屋里。统统卖脱，去买了浦西。", "need": "待配音·旁白"}, {"t": "vid", "src": "m/22.mp4", "sub": "四套房子，换了弄堂里一间老公寓。", "en": "Four flats, for one old apartment down a Puxi lane.", "who": "旁白", "line": "四套房子，换一间弄堂里个老公寓。", "need": "待配音·旁白"}, {"t": "img", "src": "m/23.webp", "dur": 3.5, "sub": "", "en": ""}, {"if": "met", "then": {"t": "img", "src": "m/24.webp", "dur": 4.5, "sub": "我花了四年，走到她对面。", "en": "It took me four years to end up across from her.", "who": "旁白", "line": "我花了四年，走到伊对面。", "need": "待配音·旁白"}, "else": {"t": "img", "src": "m/24.webp", "dur": 4.5, "sub": "对面窗里，是一户浦西人家。窗帘是丝绒的。", "en": "In the window opposite, a Puxi family. Velvet curtains.", "who": "旁白", "line": "对面窗里，是一户浦西人家。窗帘是丝绒个。", "need": "待配音·旁白"}}], "next": "c4"}, "c4": {"year": "1995", "year_if": ["sold", "1996"], "music": "m/47.mp3", "shots": [{"t": "img", "src": "m/25.webp", "dur": 4.5, "sub": "卖房子给我的沈先生，请新邻居吃饭。", "en": "Mr Shen, who had sold me the flat, invited his new neighbour to dinner.", "who": "旁白", "line": "卖房子拨我个沈先生，请新邻居吃饭。", "need": "待配音·旁白"}, {"if": "met", "then": {"t": "img", "src": "m/26.webp", "dur": 4.5, "sub": "火柴换成了吊灯。是她。", "en": "The match had become a chandelier. It was her.", "who": "旁白", "line": "火柴换成了吊灯。是伊。", "need": "待配音·旁白"}, "else": {"t": "img", "src": "m/26.webp", "dur": 4.5, "sub": "她是沈家的女主人。", "en": "She was the lady of the Shen house.", "who": "旁白", "line": "伊是沈家个女主人。", "need": "待配音·旁白"}}, {"t": "img", "src": "m/27.webp", "dur": 4.5, "sub": "她拿出一根香烟。我的手，比我的脑子先动。", "en": "She took out a cigarette. My hand moved before my head did.", "who": "旁白", "line": "伊拿出一根香烟。我个手，比我个脑子先动。", "need": "待配音·旁白"}, {"t": "img", "src": "m/27.webp", "dur": 3.5, "sub": "沈先生的打火机，先点着了。", "en": "Mr Shen’s lighter got there first.", "who": "旁白", "line": "沈先生个打火机，先点着了。", "need": "待配音·旁白"}, {"t": "img", "src": "m/28.webp", "dur": 3.5, "sub": "你原来是哪里人？", "en": "“Where are you from, originally?”", "who": "沈家骏", "line": "侬老底子是阿里人？", "need": "待配音·沈家骏"}, {"t": "img", "src": "m/28.webp", "dur": 3, "sub": "……浦东。", "en": "“…Pudong.”", "who": "阿乔", "line": "……浦东。", "need": "待配音·阿乔"}, {"t": "img", "src": "m/28.webp", "dur": 4.5, "sub": "浦东啊？乡下呀。", "en": "“Pudong? That’s the countryside.”", "who": "薇薇（侧身对丈夫，轻声）", "line": "浦东啊？乡下头呀。", "vo": "m/29.mp3", "need": "现在是旧的阿姨声音，要用薇薇的声音重配"}, {"t": "img", "src": "m/30.webp", "dur": 3.5, "sub": "", "en": ""}], "choice": {"q": "一桌子人都在笑。你也可以笑。", "qen": "The whole table is laughing. You could laugh too.", "opts": [{"l": "笑笑，坐下去", "en": "Smile, sit back down", "to": "e1"}, {"l": "起身，走出去", "en": "Stand up and leave", "to": "e2"}]}}, "c5": {"year": "1996", "music": "m/45.mp3", "shots": [{"t": "ph", "desc": "周敏敲开新村的门，开口叫“乔师傅”（1996）", "dur": 4.5, "sub": "乔师傅，沈先生托我来的。这套房子，你开个价。", "en": "“Master Qiao — Mr Shen sent me. Name your price for the flat.”", "who": "周敏", "line": "乔师傅，沈先生托我来个。迭套房子，侬开个价。", "need": "待补静帧；待配音·周敏"}, {"t": "ph", "desc": "周敏敲开新村的门，开口叫“乔师傅”（1996）", "dur": 4.5, "sub": "一九九六年，浦东涨了。涨得还不够多，刚好够我动心。", "en": "1996. Pudong had gone up. Not by enough — just enough to tempt me.", "who": "旁白", "line": "一九九六年，浦东涨了。涨得还不够多，正好够我动心。", "need": "待补静帧；待配音·旁白"}], "choice": {"q": "这笔钱，够买浦西一间亭子间。不够买回一个灶间。", "qen": "Enough for a box room in Puxi. Not enough to buy back a kitchen.", "opts": [{"l": "卖掉，买间亭子间", "en": "Sell, buy a box room in Puxi", "to": "n5a", "set": "sold"}, {"l": "勿卖", "en": "Keep it", "to": "e4"}]}}, "n5a": {"year": "1996", "music": "m/45.mp3", "shots": [{"t": "ph", "desc": "浦西弄堂里朝北的亭子间（1996）", "dur": 4.5, "sub": "钱只够一间亭子间，朝北，冬天晒不到太阳。", "en": "The money bought a box room facing north. No sun in winter.", "who": "旁白", "line": "钞票只够一间亭子间，朝北，冬天晒不着太阳。", "need": "待补静帧；待配音·旁白"}, {"t": "ph", "desc": "浦西弄堂里朝北的亭子间（1996）", "dur": 4.5, "sub": "卖亭子间给我的，也是这位沈先生。他请我吃饭。", "en": "The man who sold it to me was that same Mr Shen. He invited me to dinner.", "who": "旁白", "line": "卖拨我亭子间个，也是迭位沈先生。伊请我吃饭。", "need": "待补静帧；待配音·旁白"}], "next": "c4"}, "e1": {"year": "1999", "music": "m/45.mp3", "ending": 1, "shots": [{"t": "img", "src": "m/23.webp", "dur": 4.5, "sub": "过江以后，我跟老金一年只吃一顿年夜饭。后来，年夜饭也没了。", "en": "After I crossed, Lao Jin and I ate together once a year, on New Year’s Eve. Then not even that.", "who": "旁白", "line": "过江以后，我搭老金，一年只吃一顿年夜饭。后来，年夜饭也没了。", "need": "待配音·旁白"}, {"if": "met", "then": {"t": "img", "src": "m/52.webp", "dur": 5.5, "sub": "一九九九年，外滩。她走过我身边，回头看了一眼。火一灭，她就转回去了。", "en": "1999, the Bund. She passed me and glanced back. When the flame died, she turned away.", "who": "旁白", "line": "一九九九年，外滩。伊走过我身边，回头看了一眼。火一熄，伊就转回去了。", "need": "待配音·旁白"}, "else": {"t": "img", "src": "m/52.webp", "dur": 5.5, "sub": "一九九九年，外滩。沈家一家人走过我身边。沈太太看了我一眼，没认出我。", "en": "1999, the Bund. The Shens walked past me. Mrs Shen looked at me and didn’t know me.", "who": "旁白", "line": "一九九九年，外滩。沈家一家门走过我身边。沈太太看了我一眼，没认出我。", "need": "待配音·旁白"}}, {"t": "img", "src": "m/53.webp", "dur": 4.5, "sub": "「爸爸，对面是什么地方？」「浦东。」", "en": "“Daddy, what’s over there?” “Pudong.”", "who": "沈囡囡 / 沈家骏", "line": "阿爸，对面是啥地方？ / 浦东。", "vo": "m/54.mp3", "need": "暂用旧 S24 口型版音轨，父亲要换成沈家骏的声音"}, {"t": "vid", "src": "m/36.mp4", "sub": "浦东的灯，我数不清了。火柴，还剩三根。", "en": "I could no longer count the lights of Pudong. Three matches left.", "who": "旁白", "line": "浦东个灯，我数不清了。自来火，还剩三根。", "need": "待配音·旁白", "left": 3}, {"t": "vid", "src": "m/37.mp4", "sub": "", "en": "", "year": "2016"}, {"t": "vid", "src": "m/38.mp4", "sub": "二〇一六年，我划了最后一根。", "en": "2016. I struck the last one.", "who": "旁白", "line": "二〇一六年，我划最后一根。", "need": "待配音·旁白", "left": 0, "sfx": "strike"}, {"t": "vid", "src": "m/39.mp4", "sub": "对岸的灯，我看了一辈子。没有一盏，是为我亮的。", "en": "I watched the lights on the other shore all my life. Not one of them was lit for me.", "who": "旁白", "line": "对岸个灯，我看了一世人生。呒没一盏，是为我亮个。", "need": "待配音·旁白"}, {"t": "vid", "src": "m/40.mp4", "sub": "", "en": ""}, {"t": "vid", "src": "m/41.mp4", "sub": "……有一盏，在楼背后。我看了一辈子，一次也没看见。", "en": "…There was one, behind the towers. I looked all my life and never once saw it.", "who": "旁白", "line": "……有一盏，辣楼背后。我看了一世人生，一趟也没看见。", "need": "反打要是全片唯一一个不动的镜头，考虑换成静帧；待配音·旁白"}, {"t": "card", "text": "人望了一辈子对岸。对岸也在望，望个是另一个对岸。", "en": "We spend our lives looking at the other shore. The other shore is looking too — at another shore.", "dur": 5}]}, "e2": {"year": "1995", "year_if": ["sold", "1996"], "music": "m/45.mp3", "ending": 2, "shots": [{"t": "ph", "desc": "他走出饭店，外滩夜风", "dur": 4.5, "sub": "我放下筷子。没人留我。", "en": "I put down my chopsticks. No one asked me to stay.", "who": "旁白", "line": "我放下筷子。没人留我。", "need": "待补静帧；待配音·旁白"}, {"t": "img", "src": "m/42.webp", "dur": 4.5, "sub": "外滩的风，比浦东大。", "en": "The wind on the Bund was stronger than in Pudong.", "who": "旁白", "line": "外滩个风，比浦东大。", "need": "待配音·旁白"}, {"t": "ph", "desc": "火柴盒落进黄浦江", "dur": 4.5, "sub": "我把火柴盒扔进黄浦江。它漂了一会儿，没沉。", "en": "I threw the matchbox into the Huangpu. It floated a while. It didn’t sink.", "who": "旁白", "line": "我把自来火盒子掼进黄浦江。伊漂了一歇，没沉。", "need": "待补静帧；待配音·旁白", "box": false}, {"t": "ph", "desc": "火柴盒落进黄浦江", "dur": 4.5, "sub": "我扔掉的，是老金的火柴。", "en": "What I threw away were Lao Jin’s matches.", "who": "旁白", "line": "我掼脱个，是老金个自来火。", "need": "待补静帧；待配音·旁白"}, {"t": "ph", "desc": "外滩码头，末班轮渡（夜）", "dur": 4.5, "sub": "浦东的房子卖掉了，浦西的门进不去。", "en": "The Pudong flats were sold. The doors of Puxi wouldn’t open to me.", "who": "旁白", "line": "浦东个房子卖脱了，浦西个门开弗进。", "need": "待补静帧；待配音·旁白"}, {"t": "ph", "desc": "外滩码头，末班轮渡（夜）", "dur": 4.5, "sub": "末班轮渡在鸣笛。我站 function resume(){
  if(!paused) return;
  paused=false; $('#frame').classList.remove('paused'); $('#pausecard').classList.remove('on');
  if(music.dataset.src) music.play().catch(()=>{});
  if(vid.classList.contains('on') && !vid.ended) vid.play().catch(()=>{});
  if(vo.src && vo.currentTime>0 && !vo.ended) vo.play().catch(()=>{});
  if(remain>=0 && !busy){deadline=performance.now()+remain; timer=setTimeout(next,remain);}
  else if(!busy && still.classList.contains('on') && queue[qi] && queue[qi].t==='img') arm(curDur);
}
function closePause(){paused=false; $('#frame').classList.remove('paused'); $('#pausecard').classList.remove('on'); clearShot(); vid.pause();}
function goBack(){ const s=history.pop(); if(!s) return;
  state=s; drawBox(); $('#endcard').classList.remove('on'); const n=STORY.nodes[s.node];
  $('#year').textContent=nodeYear(n); setMusic(n.music); still.classList.remove('on'); vid.classList.remove('on'); ph.classList.remove('on'); cardtxt.classList.remove('on');
  // show last still of that node behind the choice
  const last=resolve(n.shots).filter(x=>x.t==='img').pop(); if(last){still.src=U(last.src); still.dataset.src=last.src; still.classList.add('on');}
  showChoice(n.choice);}
$('#backBtn').onclick=e=>{e.stopPropagation(); $('#pauseBtn').hidden=false; goBack();};
$('#pauseBtn').onclick=e=>{e.stopPropagation(); pause();};
$('#resumeBtn').onclick=e=>{e.stopPropagation(); resume();};
$('#pBackBtn').onclick=e=>{e.stopPropagation(); closePause(); goBack(); if(music.dataset.src) music.play().catch(()=>{});};
$('#pTitleBtn').onclick=e=>{e.stopPropagation(); closePause(); setMusic(null); toTitle();};
$('#pNotesChk').onchange=e=>{notes=e.target.checked; $('#notesChk').checked=notes; if(queue && queue[qi]) showSub(queue[qi]);};
$('#pausecard').addEventListener('click',e=>e.stopPropagation());
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });
$('#frame').addEventListener('click',()=>{ if(!paused && !busy && state && state.node) next(); });
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '||k==='p'||k==='P'||k==='Escape'){ if(paused){e.preventDefault(); resume(); return;} if(inPlay()){e.preventDefault(); pause(); return;} }
  if(k==='ArrowRight' && !paused && !busy && state && state.node){e.preventDefault(); next();}
});
gallery($('#gal1')); lampCheck();
[still,vid].forEach(fallback);

/* --- film grain --- */
(function(){const c=$('#grain'),x=c.getContext('2d'); c.width=320; c.height=134;
  const img=x.createImageData(c.width,c.height);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){draw();return;}
  function draw(){const d=img.data; for(let i=0;i<d.length;i+=4){const v=Math.random()*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=60;} x.putImageData(img,0,0);}
  let t=0;(function loop(){ if(++t%3===0) draw(); requestAnimationFrame(loop);})();
})();
</script>
