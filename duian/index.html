<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>对岸 THE OTHER SHORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one 2.39:1 film frame centred on black; everything (subs, choices, HUD) lives inside the frame like a print. */
:root{
  --night:#07080a; --frame:#000; --paper:#efe6d6; --dim:#9c9387;
  --flame:#e9a54f; --ember:#b8562b; --line:rgba(239,230,214,.22);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --latin:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--serif);margin:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding-inline:0}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:min(100vw,calc(100dvh * 2.39));aspect-ratio:2.39/1;max-width:100%;max-height:100%;
  background:var(--frame);overflow:hidden;container-type:inline-size;cursor:pointer}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#still{opacity:0;transition:opacity .9s ease;transform-origin:50% 50%}
#still.on{opacity:1}
#still.kb0{animation:kb0 var(--kb,8s) linear forwards}
#still.kb1{animation:kb1 var(--kb,8s) linear forwards}
@keyframes kb0{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.10) translate(-1.2%,-.8%)}}
@keyframes kb1{from{transform:scale(1.10) translate(1%,.6%)}to{transform:scale(1.03) translate(0,0)}}
#vid{opacity:0;transition:opacity .5s ease;background:#000}
#vid.on{opacity:1}
#ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;opacity:0;transition:opacity .8s;
  background:radial-gradient(ellipse at 50% 60%,#1a1612 0%,#08080a 70%);text-align:center;padding-inline:8cqw}
#ph.on{opacity:1}
#ph .tag{font-size:1.1cqw;letter-spacing:.4em;color:var(--flame);border:1px solid var(--flame);padding:.3cqw .9cqw}
#ph .desc{font-size:2.1cqw;color:var(--dim);line-height:1.6}
#grain{pointer-events:none;mix-blend-mode:overlay;opacity:.35}
#vignette{pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{pointer-events:none;background:radial-gradient(circle at 50% 70%,rgba(233,165,79,.55),transparent 60%);opacity:0;transition:opacity .6s}
#flash.on{opacity:1;transition:opacity .05s}

#year{position:absolute;left:2.4cqw;top:1.8cqw;font-family:var(--latin);font-style:italic;font-size:1.7cqw;letter-spacing:.12em;color:var(--paper);opacity:.75;font-variant-numeric:tabular-nums}
#box{position:absolute;right:2.4cqw;top:1.8cqw;display:flex;align-items:flex-end;gap:.32cqw;height:2.2cqw}
#box i{display:block;width:.28cqw;height:2cqw;background:linear-gradient(to bottom,var(--ember) 0 22%,#d9c3a0 22%);border-radius:.14cqw .14cqw 0 0;transition:opacity .6s,transform .6s}
#box i.burnt{opacity:.15;transform:translateY(.5cqw)}
#need{position:absolute;right:2.4cqw;top:4.6cqw;font-size:1cqw;color:var(--flame);letter-spacing:.08em;opacity:.85}

#subs{position:absolute;left:0;right:0;bottom:3.2cqw;text-align:center;padding-inline:10cqw;pointer-events:none;
  text-shadow:0 0 .4cqw rgba(0,0,0,.9),0 .1cqw .2cqw #000}
#subs .zh{font-size:2.15cqw;line-height:1.55;letter-spacing:.06em;color:#f3e7c9;text-wrap:balance}
#subs .en{font-family:var(--latin);font-size:1.55cqw;font-style:italic;color:#d7ccb8;margin-top:.3cqw}
#subs{opacity:0;transition:opacity .5s}
#subs.on{opacity:1}

/* choice */
#choice{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2cqw;padding-bottom:5cqw;
  background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.15) 65%,transparent);opacity:0;pointer-events:none;transition:opacity .8s;cursor:default}
#choice.on{opacity:1;pointer-events:auto}
#choice .q{font-size:2.4cqw;letter-spacing:.12em}
#choice .qen{font-family:var(--latin);font-style:italic;font-size:1.5cqw;color:var(--dim);margin-top:-1.4cqw}
#opts{display:flex;gap:3cqw;flex-wrap:wrap;justify-content:center}
.opt{position:relative;background:none;border:0;color:var(--paper);font-family:var(--serif);cursor:pointer;padding:1cqw 1.6cqw 1cqw 3.4cqw;text-align:left;
  border-bottom:1px solid var(--line);transition:border-color .3s,color .3s}
.opt::before{content:"";position:absolute;left:.6cqw;top:50%;width:2cqw;height:.3cqw;transform:translateY(-50%);
  background:linear-gradient(to right,#d9c3a0 78%,var(--ember) 78%);border-radius:0 .15cqw .15cqw 0}
.opt b{display:block;font-weight:600;font-size:2.05cqw;letter-spacing:.1em}
.opt span{display:block;font-family:var(--latin);font-style:italic;font-size:1.35cqw;color:var(--dim)}
.opt:hover,.opt:focus-visible{border-color:var(--flame);color:#fff;outline:none}
.opt:hover::before,.opt:focus-visible::before{background:linear-gradient(to right,#d9c3a0 70%,var(--flame) 70%);box-shadow:1.3cqw 0 1cqw rgba(233,165,79,.55)}

/* cards: title & ending */
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;
  background:rgba(4,4,6,.9);opacity:0;pointer-events:none;transition:opacity 1s;cursor:default;text-align:center}
.card.on{opacity:1;pointer-events:auto}
.title{font-weight:900;font-size:8cqw;letter-spacing:.5em;margin-right:-.5em;line-height:1}
.subtitle{font-family:var(--latin);font-size:1.8cqw;letter-spacing:.6em;color:var(--dim);margin-right:-.6em}
.credit{font-size:1.1cqw;letter-spacing:.3em;color:var(--dim)}
.btnrow{display:flex;gap:2cqw;flex-wrap:wrap;justify-content:center;margin-top:1cqw}
.btn{background:none;border:1px solid var(--line);color:var(--paper);font-family:var(--serif);font-size:1.5cqw;letter-spacing:.25em;
  padding:.8cqw 2.4cqw;cursor:pointer;transition:border-color .3s,background .3s}
.btn:hover,.btn:focus-visible{border-color:var(--flame);background:rgba(233,165,79,.08);outline:none}
.gallery{display:flex;gap:1.6cqw;margin-top:1cqw}
.slot{width:12cqw;border-top:1px solid var(--line);padding-top:.7cqw;font-size:1.25cqw;color:#4d4842;letter-spacing:.1em}
.slot.got{color:var(--paper);border-color:var(--flame)}
.slot small{display:block;font-family:var(--latin);font-style:italic;font-size:1cqw;color:var(--dim)}
.endno{font-family:var(--latin);font-style:italic;font-size:1.6cqw;color:var(--flame);letter-spacing:.2em}
.endname{font-weight:900;font-size:6cqw;letter-spacing:.3em;margin-right:-.3em}
.endline{font-size:1.7cqw;color:var(--paper);letter-spacing:.08em}
.endmeta{font-size:1.2cqw;color:var(--dim);letter-spacing:.12em;font-variant-numeric:tabular-nums}
label.notes{font-size:1.1cqw;color:var(--dim);letter-spacing:.1em;display:flex;gap:.6cqw;align-items:center;cursor:pointer}
#hint{position:absolute;bottom:1cqw;right:2.4cqw;font-size:.95cqw;color:var(--dim);opacity:.6;letter-spacing:.1em}
#pauseBtn{position:absolute;left:2.4cqw;bottom:1.2cqw;background:none;border:1px solid var(--line);color:var(--paper);
  font-family:var(--serif);font-size:1.1cqw;letter-spacing:.2em;padding:.35cqw 1cqw;cursor:pointer;opacity:.7;transition:opacity .3s,border-color .3s;display:flex;gap:.5cqw;align-items:center}
#pauseBtn:hover,#pauseBtn:focus-visible{opacity:1;border-color:var(--flame);outline:none}
#pauseBtn svg{width:1cqw;height:1cqw}
#frame.paused #still,#frame.paused #grain{animation-play-state:paused}
#pausecard .ptitle{font-weight:600;font-size:3.2cqw;letter-spacing:.5em;margin-right:-.5em}
#pausecard .where{font-size:1.2cqw;color:var(--dim);letter-spacing:.15em}
#pausecard .btnrow{flex-direction:column;align-items:stretch;gap:1cqw;min-width:22cqw}
#pausecard .keys{font-size:1cqw;color:var(--dim);letter-spacing:.1em}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.2cqw;letter-spacing:.4em;color:var(--dim);opacity:0;transition:opacity .4s;pointer-events:none}
#loading.on{opacity:1;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#still.kb0,#still.kb1{animation:none}}
</style>
</head>
<body>

<div id="wrap"><div id="frame" aria-live="polite">
  <img id="still" class="layer" alt="">
  <video id="vid" class="layer" playsinline preload="auto"></video>
  <div id="ph" class="layer"><div class="tag">待补静帧</div><div class="desc"></div></div>
  <canvas id="grain" class="layer"></canvas>
  <div id="vignette" class="layer"></div>
  <div id="flash" class="layer"></div>

    <div class="btnrow">

    <div class="keys">继续：空格 / P / Esc　·　跳过这一格：点击画面 / →</div>
  </div>

  <div id="endcard" class="card">
    <div class="endno"></div>
    <div class="endname"></div>
    <div class="endline"></div>
    <div class="endmeta"></div>
    <div class="gallery" id="gal2"></div>
    <div class="btnrow">
      <button class="btn" id="backBtn">回到上一个选择</button>
      <button class="btn" id="againBtn">从头再来</button>
    </div>
  </div>
</div></div>

<script>
const STORY = {"start": "prologue", "nodes": {"prologue": {"year": "2016", "music": "m/45.mp3", "shots": [{"t": "vid", "src": "m/00.mp4", "sub": "二〇一六年。", "en": "2016."}, {"t": "vid", "src": "m/01.mp4", "sub": "一九九一年三月，夜里向九点钟。浦东个灯，一盏一盏，数得清。", "en": "March 1991, nine at night. You could still count the lights of Pudong."}], "next": "c1"}, "c1": {"year": "1991", "music": "m/45.mp3", "shots": [{"t": "img", "src": "m/02.webp", "sub": "末班轮渡前，一个浦西女人走过来。", "en": "Before the last ferry, a woman from Puxi walked over.", "dur": 4.5}, {"t": "img", "src": "m/03.webp", "sub": "「有火伐？」", "en": "\"Got a light?\"", "dur": 4.5, "need": "新台词待配音"}], "choice": {"q": "她在等你的火。", "qen": "She is waiting for a light.", "opts": [{"l": "划一根自来火", "en": "Strike a match", "to": "n1a", "set": "met"}, {"l": "讲：呒没", "en": "\"No, I don't.\"", "to": "n1b"}]}}, "n1a": {"year": "1991", "music": "m/45.mp3", "shots": [{"t": "img", "src": "m/04.webp", "sub": "我借拨伊一根自来火。", "en": "I gave her a match.", "dur": 4.5, "need": "新台词待配音"}, {"t": "img", "src": "m/05.webp", "sub": "火光里，我第一趟看清爽伊个面孔。", "en": "In the light, I saw her face for the first time.", "dur": 4.5, "need": "新台词待配音"}, {"t": "img", "src": "m/06.webp", "sub": "伊上了船。", "en": "She got on the boat.", "dur": 4.5}, {"t": "vid", "src": "m/07.mp4", "sub": "从此以后，对岸有了一个人。", "en": "From then on, there was someone on the other shore.", "need": "新台词待配音"}], "next": "c2"}, "n1b": {"year": "1991", "music": "m/45.mp3", "shots": [{"t": "ph", "desc": "她转身走开，向别人借火（背影）", "sub": "我讲，呒没。", "en": "I said no.", "dur": 4.5, "need": "待补静帧＋新台词"}, {"t": "vid", "src": "m/08.mp4", "sub": "对岸，还是对岸。", "en": "The other shore was just the other shore.", "need": "新台词待配音"}], "next": "c2"}, "c2": {"year": "1992", "music": "m/46.mp3", "shots": [{"t": "vid", "src": "m/09.mp4", "sub": "一九九二年，动迁个消息来了。", "en": "1992. Word came: the old houses would be torn down.", "need": "新台词待配音"}, {"t": "vid", "src": "m/10.mp4", "sub": "「量到哪里，算到哪里。」", "en": "\"Whatever we measure is what you get.\""}, {"t   if(k===' '||k==='p'||k==='P'||k==='Escape'){ if(paused){e.preventDefault(); resume(); return;} if(inPlay()){e.preventDefault(); pause(); return;} }
  if(k==='ArrowRight' && !paused && !busy && state && state.node){e.preventDefault(); next();}
});

/* --- film grain --- */
(function(){const c=$('#grain'),x=c.getContext('2d'); c.width=320; c.height=134;
  const img=x.createImageData(c.width,c.height);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){draw();return;}
  function draw(){const d=img.data; for(let i=0;i<d.length;i+=4){const v=Math.random()*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=60;} x.putImageData(img,0,0);}
  let t=0;(function loop(){ if(++t%3===0) draw(); requestAnimationFrame(loop);})();
})();
</script>
