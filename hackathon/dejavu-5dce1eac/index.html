<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>孟婆汤 Déjà vu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: a 3D particle world fills the screen; camera moves between stations. A thin text layer at top or bottom carries only labels and the inputs. */
:root{
  --ink:#f3eefc; --ink-dim:#c4bbe0; --ink-faint:#8e85b5;
  --mint:#e9e4f7; --lilac:#cfc6ea; --peach:#f4ead8; --gold:#ecd9a6;
  --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.18);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --latin:"Cormorant Garamond","Noto Serif SC",serif;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none;touch-action:none}
body{background:#100d24;color:var(--ink);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding-inline:20px;padding-block:22px;pointer-events:none}
.scene{margin-block:auto;width:100%;max-width:500px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;transform:translateY(8px);transition:opacity .9s ease,transform .9s ease}
.scene > *{pointer-events:auto}
.scene.top{margin-top:4vh;margin-bottom:auto}
.scene.bottom{margin-top:auto;margin-bottom:5vh}
.scene.on{opacity:1;transform:none}
.eyebrow{font-family:var(--latin);font-style:italic;font-size:15px;letter-spacing:.2em;color:var(--ink-faint)}
h1{font-weight:400;font-size:clamp(34px,9vw,52px);letter-spacing:.16em;margin:0;text-shadow:0 0 30px rgba(201,182,255,.6)}
h1 .lat{display:block;font-family:var(--latin);font-style:italic;font-size:.42em;letter-spacing:.1em;color:var(--lilac);margin-top:4px}
.hall{font-size:clamp(18px,4.8vw,22px);letter-spacing:.6em;padding-left:.6em;color:var(--gold);display:flex;align-items:center;gap:14px;text-shadow:0 0 16px rgba(236,217,166,.45)}
.hall::before,.hall::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.big{font-size:clamp(26px,7vw,38px);letter-spacing:.16em;color:var(--peach);text-shadow:0 0 24px rgba(255,210,184,.5)}
.btn{font-family:var(--serif);font-size:15px;letter-spacing:.28em;padding:12px 26px 12px 30px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;backdrop-filter:blur(8px);transition:border-color .3s,background .3s,opacity .5s}
.btn:hover{border-color:var(--lilac);background:rgba(201,182,255,.14)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-faint);font-size:13px;padding:6px 10px;letter-spacing:.15em}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.btn[disabled]{opacity:0;pointer-events:none}
.hint{font-size:13px;color:var(--ink-faint);letter-spacing:.14em;min-height:1.4em}
form.f{background:rgba(16,13,36,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px;max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.slotno{font-size:12px;letter-spacing:.35em;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.panelhead{display:flex;flex-direction:column;gap:4px;align-items:center}
.cat{font-size:21px;letter-spacing:.16em}
input.t{width:100%;max-width:320px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font-family:var(--serif);font-size:22px;text-align:center;padding:8px 4px;user-select:text;-webkit-user-select:text}
input.t::placeholder{color:var(--ink-faint);font-size:15px}
.caption{min-height:2.2em;font-size:19px;line-height:1.7;letter-spacing:.06em;color:var(--ink);max-width:20em;transition:opacity .5s;text-wrap:balance;text-shadow:0 0 18px rgba(16,13,36,.9)}
.flight{display:flex;align-items:baseline;gap:14px;font-size:14px;letter-spacing:.12em;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.flight b{font-family:var(--latin);font-weight:500;color:var(--lilac);letter-spacing:.1em}
.flight i{font-style:normal;color:var(--gold);font-size:13px;animation:blink 1.4s infinite}
.board{width:100%;max-width:320px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:rgba(16,13,36,.35);backdrop-filter:blur(6px)}
.board div{display:grid;grid-template-columns:5em 1fr auto;gap:10px;font-size:13px;line-height:2;text-align:left}
.board b{font-family:var(--latin);font-weight:500;letter-spacing:.08em;color:var(--lilac)}
.board span{color:var(--ink-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board i{font-style:normal;color:var(--mint);font-size:12px}
.board i.you{color:var(--gold);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;transform:translate(-50%,calc(-100% - 14px));max-width:min(230px,64vw);background:rgba(16,13,36,.78);border:1px solid var(--line);border-radius:14px;padding:8px 13px;font-size:14px;line-height:1.65;text-align:left;backdrop-filter:blur(6px)}
.bubble .desk{color:var(--mint);font-size:13px}
.ring{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:1.5px solid var(--mint);animation:ring 1.3s ease-out infinite}
.ring::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid var(--mint);animation:ring 1.3s .65s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(3.4);opacity:0}}
.tag{position:absolute;transform:translate(-50%,0);font-size:12px;color:var(--ink-dim);white-space:nowrap;max-width:20vw;overflow:hidden;text-overflow:ellipsis;transition:color .4s,opacity .6s;text-shadow:0 0 8px #100d24}
.tag.gold{color:var(--gold)}
.tag .w{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.stampfx{position:absolute;transform:translate(-50%,-50%) rotate(-12deg);border:2px solid var(--gold);color:var(--gold);border-radius:6px;padding:2px 10px;font-size:15px;letter-spacing:.25em;animation:stamp .8s ease forwards;text-shadow:0 0 10px rgba(255,224,138,.8)}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(1.8)}30%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) rotate(-12deg) scale(1)}}
/* boarding pass */
.pass{width:100%;max-width:400px;text-align:left;color:#2a2350;filter:drop-shadow(0 30px 60px rgba(0,0,0,.55))}
.pass .main,.pass .stub{background:linear-gradient(160deg,#fbf7ff,#efe7ff 60%,#e6f7f3)}
.pass .main{border-radius:18px 18px 6px 6px;position:relative;overflow:hidden}
.pass .stub{border-radius:6px 6px 18px 18px;border-top:2px dashed rgba(91,75,176,.3);padding:12px 22px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:grab;touch-action:none;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.pass .stub.drag{transition:none;cursor:grabbing}
.pass .stub.torn{transform:translate(10px,26px) rotate(-5deg)}
.pass .top{padding:18px 22px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pass .brand{font-family:var(--latin);font-style:italic;font-size:22px;color:#5b4bb0}
.pass .brand small{display:block;font-family:var(--serif);font-style:normal;font-size:11px;letter-spacing:.3em;color:#8c80b8}
.pass .flt{font-family:var(--latin);font-size:15px;letter-spacing:.12em;color:#5b4bb0;font-variant-numeric:tabular-nums}
.pass .route{padding:2px 22px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.pass .k{font-size:10px;letter-spacing:.3em;color:#8c80b8}
.pass .v{font-size:17px;letter-spacing:.06em}
.pass .v.dest{font-size:21px;color:#3b2f86}
.pass .arrow{font-family:var(--latin);color:#a99ad9;font-size:20px;padding-bottom:2px}
.pass .bag{padding:2px 22px 6px}
.pass ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.pass li{font-size:13px;line-height:1.55;display:grid;grid-template-columns:5em 1fr;gap:8px}
.pass li b{font-weight:600;color:#5b4bb0;overflow-wrap:anywhere}
.pass li span{color:#4a4270}
.pass li.secret b,.pass li.secret span{color:#a99ad9;letter-spacing:.1em}
.pass .portrait{padding:10px 22px 16px;font-size:14px;line-height:1.8;color:#3b2f86}
.pass .stampmark{position:absolute;right:18px;top:56px;transform:rotate(-12deg);border:2px solid rgba(214,150,60,.75);color:rgba(194,128,40,.9);border-radius:6px;padding:2px 8px;font-size:13px;letter-spacing:.2em}
.pass .stub .tear{font-size:12px;letter-spacing:.2em;color:#8c80b8}
.card{touch-action:auto;display:block;width:auto;max-width:min(400px,100%);max-height:calc(100vh - 150px);height:auto;filter:drop-shadow(0 28px 60px rgba(36,31,61,.35));animation:rise 1.2s cubic-bezier(.2,.8,.2,1);-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:5;font-family:var(--serif);font-size:12px;letter-spacing:.2em;color:var(--ink-faint);background:rgba(16,13,36,.35);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.snd:hover{color:var(--ink)}
.snd:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.whisper{margin:0;font-size:clamp(19px,5vw,23px);line-height:1.9;letter-spacing:.12em;color:var(--ink);text-shadow:0 0 20px rgba(16,13,36,.9)}
.holdwrap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18vh);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:4;transition:opacity .6s}
.holdwrap.gone{opacity:0}
.hold{position:relative;width:92px;height:92px;border-radius:50%;border:1px solid var(--line);background:rgba(16,13,36,.45);color:var(--ink);font-family:var(--serif);font-size:14px;letter-spacing:.2em;cursor:pointer;touch-action:none;backdrop-filter:blur(6px)}
.hold svg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg)}
.hold circle{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round}
.choose{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.ripple{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:1px solid var(--ink);animation:rip 1.2s ease-out forwards;pointer-events:none}
@keyframes rip{from{transform:scale(1);opacity:.9}to{transform:scale(9);opacity:0}}
#wash{position:fixed;inset:0;background:#f9f7fc;opacity:0;pointer-events:none;transition:opacity 2.6s ease}
body.paper{background:#f9f7fc;--ink:#241f3d;--ink-dim:#4a4468;--ink-faint:#8a83a6;--gold:#a9822f;--line:rgba(36,31,61,.2);--glass:rgba(36,31,61,.05);--mint:#6b5fa0;--peach:#3b2f5e}
body.paper .big,body.paper h1,body.paper .caption,body.paper .whisper{text-shadow:none}
body.paper .snd{background:rgba(255,255,255,.6)}
.sum{display:flex;flex-direction:column;gap:2px;width:min(240px,70vw);font-size:15px;letter-spacing:.06em;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.wrow{display:flex;justify-content:space-between;gap:16px;animation:pop .5s ease}
.wrow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum b{font-weight:400;color:var(--gold);white-space:nowrap}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scale{width:min(260px,70vw);height:auto;overflow:visible}
.scale line,.scale path{stroke:var(--ink-dim);stroke-width:1.4;fill:none;stroke-linecap:round}
.scale .g{fill:var(--gold)}
.scale .wt{fill:var(--gold);stroke:none;opacity:.9}
.scale text{fill:var(--gold);font-family:var(--serif);font-size:11px;text-anchor:middle;letter-spacing:.05em}
.scale .drop{fill:var(--gold);animation:drop .5s cubic-bezier(.3,1.4,.6,1)}
@keyframes drop{from{transform:translateY(-46px);opacity:0}to{transform:none;opacity:1}}
.fog{position:absolute;pointer-events:none;transition:opacity 1.2s}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){.scene{transition:none}.ring,.ring::after{animation:none}}
</style>
</head>
<body>


<div id="wash"></div>
<div id="fx"></div>
<button class="snd" id="snd" type="button" aria-pressed="true">声音 · 开</button>
<div class="stage" id="stage"></div>

<script src="three.min.js"></script>
<script src="qrcode.js"></script>
<script>
(() => {
const V3=THREE.Vector3, rnd=(a,b)=>a+Math.random()*(b-a), sleep=ms=>new Promise(r=>setTimeout(r,ms));
let W=innerWidth,H=innerHeight;const DPR=Math.min(2,devicePixelRatio||1),FOV=55;
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(DPR);renderer.setSize(W,H);renderer.domElement.id='sky';document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(FOV,W/H,.05,600);scene.add(camera);
let SCALE=H*DPR/(2*Math.tan(FOV*Math.PI/360));

/* ---------- sky ---------- */
const skyU={uLight:{value:.12},uWhite:{value:0}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(400,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:skyU,
 vertexShader:`varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform float uLight,uWhite;varying vec3 vP;void main(){float y=vP.y;
  vec3 top=vec3(.05,.045,.11),mid=vec3(.12,.105,.22),hor=vec3(.25,.22,.36),glow=vec3(.62,.58,.72);
  vec3 c=mix(hor,mid,smoothstep(0.,.3,y));c=mix(c,top,smoothstep(.3,.95,y));c=mix(c,vec3(.12,.09,.22),smoothstep(0.,-.35,y));
  c+=glow*.16*exp(-abs(y-.02)*12.);
  c*=min(uLight,1.);c+=vec3(1.,.96,.9)*max(0.,uLight-1.)*(.4+.6*pow(max(y,0.),.6));c=mix(c,vec3(.975,.968,.988)-vec3(.03,.03,.02)*smoothstep(.2,-.3,y),uWhite);gl_FragColor=vec4(c,1.);}`}));
scene.add(sky);

/* ---------- particle groups ---------- */
const VS=`attribute vec3 acol;attribute float asz;attribute float aph;uniform float uScale,uS,uTime,uWob,uGold,uFog,uInk;varying vec3 vC;varying float vA;
void main(){vec3 p=position+vec3(sin(uTime*1.3+aph*6.3),cos(uTime*1.1+aph*9.1),sin(uTime*.9+aph*4.7))*uWob;
 vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;float d=max(-mv.z,.05);
 gl_PointSize=min(asz*uS*uScale/d,96.);vC=mix(mix(acol,vec3(1.,.9,.7),uGold),mix(vec3(.2,.17,.33)+(1.-acol)*.25,vec3(.66,.5,.2),uGold),uInk);vA=exp(-d*uFog)*(.75+.25*sin(uTime*2.+aph*20.));}`;
const FS=`uniform float uOp;varying vec3 vC;varying float vA;void main(){vec2 c=gl_PointCoord-.5;float r=length(c);if(r>.5)discard;float a=1.-r*2.;a=a*a;gl_FragColor=vec4(vC,a*uOp*vA);}`;
const ALL=[];let TIME=0,INK=0;
function inkMode(){INK=1;ALL.forEach(g=>{g.u.uInk.value=1;g.pts.material.blending=THREE.NormalBlending;g.pts.material.needsUpdate=true;});skyU.uWhite.value=1;document.body.classList.add('paper');}
class PG{
  constructor(cap,parent=scene){this.cap=cap;this.pos=new Float32Array(cap*3);this.tgt=new Float32Array(cap*3);this.col=new Float32Array(cap*3);this.sz=new Float32Array(cap);this.ph=new Float32Array(cap);this.sp=new Float32Array(cap);
    for(let i=0;i<cap;i++){this.ph[i]=Math.random();this.sp[i]=Math.random();}
    const g=new THREE.BufferGeometry();this.aPos=new THREE.BufferAttribute(this.pos,3).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position',this.aPos);this.aCol=new THREE.BufferAttribute(this.col,3);g.setAttribute('acol',this.aCol);this.aSz=new THREE.BufferAttribute(this.sz,1);g.setAttribute('asz',this.aSz);g.setAttribute('aph',new THREE.BufferAttribute(this.ph,1));g.setDrawRange(0,0);
    this.u={uScale:{value:SCALE},uS:{value:1},uTime:{value:0},uWob:{value:.006},uGold:{value:0},uFog:{value:.018},uOp:{value:0},uInk:{value:INK}};
    this.pts=new THREE.Points(g,new THREE.ShaderMaterial({uniforms:this.u,vertexShader:VS,fragmentShader:FS,transparent:true,depthWrite:false,blending:INK>.5?THREE.NormalBlending:THREE.AdditiveBlending}));
    this.pts.frustumCulled=false;this.obj=new THREE.Group();this.obj.add(this.pts);parent.add(this.obj);
    this.n=0;this.tp=null;this.ts=null;this.op=0;this.top=1;this.gold=0;this.tgold=0;this.moving=false;this.k=2.4;this.pk=3;ALL.push(this);}
  shape(pts,spawn){const nn=pts.length;if(!nn)return this;const n=Math.min(this.cap,Math.max(nn,this.n));
    for(let i=0;i<n;i++){const q=pts[i<nn?i:(Math.random()*nn|0)],j=i*3;this.tgt[j]=q[0];this.tgt[j+1]=q[1];this.tgt[j+2]=q[2];this.col[j]=q[3];this.col[j+1]=q[4];this.col[j+2]=q[5];this.sz[i]=q[6];
      if(i>=this.n){if(spawn){const s=spawn(i,q);this.pos[j]=s[0];this.pos[j+1]=s[1];this.pos[j+2]=s[2];}else{this.pos[j]=q[0];this.pos[j+1]=q[1];this.pos[j+2]=q[2];}}}
    this.n=n;this.pts.geometry.setDrawRange(0,n);this.aCol.needsUpdate=this.aSz.needsUpdate=this.aPos.needsUpdate=true;this.moving=true;return this;}
  at(x,y,z,s=1){this.obj.position.set(x,y,z);this.obj.scale.setScalar(s);return this;}
  update(dt){const o=this.obj;
    if(this.tp){o.position.lerp(this.tp,Math.min(1,dt*this.pk));}
    if(this.ts!=null){const s=o.scale.x+(this.ts-o.scale.x)*Math.min(1,dt*3);o.scale.setScalar(s);}
    this.op+=(this.top-this.op)*Math.min(1,dt*1.6);this.gold+=(this.tgold-this.gold)*Math.min(1,dt*3);
    const ws=new V3();o.getWorldScale(ws);this.u.uS.value=ws.x;this.u.uTime.value=TIME;this.u.uGold.value=this.gold;this.u.uOp.value=this.op;
    this.obj.visible=this.op>.003;
    if(this.moving){let mx=0;const k=dt*this.k;for(let i=0;i<this.n*3;i++){const ii=(i/3)|0,kk=Math.min(1,k*(.6+this.sp[ii]));const d=this.tgt[i]-this.pos[i];this.pos[i]+=d*kk;if(d*d>mx)mx=d*d;}
      this.aPos.needsUpdate=true;if(mx<1e-7)this.moving=false;}}
}
const PAL=[[.93,.91,1],[.86,.83,.98],[1,1,1],[.9,.88,1],[1,.97,.93]];
const pc=i=>PAL[i%5];
function ball(n,r,sz=.07,bright=1){const o=[];for(let i=0;i<n;i++){const a=Math.random()*6.283,b=Math.acos(rnd(-1,1)),rr=r*Math.pow(Math.random(),.6);const c=pc(i);o.push([Math.sin(b)*Math.cos(a)*rr,Math.cos(b)*rr,Math.sin(b)*Math.sin(a)*rr,c[0]*bright,c[1]*bright,c[2]*bright,sz*(rr<r*.35?1.6:1)]);}return o;}
const EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function glyph(str,emoji,maxN=1400,sz=.05,tint){const S=emoji?150:96,c=document.createElement('canvas'),x2=c.getContext('2d',{willReadFrequently:true});
  const font=`${S}px ${emoji?EF:'"Noto Serif SC",serif'}`;x2.font=font;const w=Math.max(10,Math.ceil(x2.measureText(str).width)+24),h=Math.ceil(S*1.35);c.width=w;c.height=h;
  x2.font=font;x2.textAlign='center';x2.textBaseline='middle';x2.fillStyle='#fff';x2.fillText(str,w/2,h/2);

    x.fillStyle='#f3f0fb';x.beginPath();x.roundRect?x.roundRect(qx-14,qy-14,size+28,size+28,14):x.rect(qx-14,qy-14,size+28,size+28);x.fill();x.fillStyle='#13102a';for(let r2=0;r2<n;r2++)for(let c2=0;c2<n;c2++)if(q.isDark(r2,c2))x.fillRect(qx+c2*cell,qy+r2*cell,cell+.5,cell+.5);}catch(e){}}
  x.restore();
  return c;
}
async function passScene(){mood('pass');
  destG.top=.12;items.forEach(it=>it.g.top=.15);
  show(`<div class="hint">正在出票……</div>`);
  const c=await makeCard(),url=c.toDataURL('image/png');ding();
  const el=show(`<img class="card" src="${url}" alt="下辈子的登机牌：${esc(DEST)}">
    <div class="hint" id="after">长按图片，保存或发给朋友</div>
    <div class="row"><button class="btn" id="save" hidden>保存图片</button><button class="btn ghost" id="again">再投一次胎</button></div>`);
  el.querySelector('#again').onclick=()=>location.reload();
  const dl=await (window.claude?.use?window.claude.use('downloads'):Promise.resolve(null)).catch(()=>null);
  if(dl){const b=el.querySelector('#save');b.hidden=false;el.querySelector('#after').textContent='';
    b.onclick=()=>c.toBlob(async blob=>{try{await dl.save({filename:`mengpo-${FLIGHT}.png`,data:blob});}catch(e){if(e&&e.code==='unavailable')b.hidden=true;el.querySelector('#after').textContent='长按图片，保存或发给朋友';}},'image/png');}
}

snd.textContent=MUTE?'声音 · 关':'声音 · 开';snd.onclick=()=>{if(MUTE)unlockAudio();ac();setMute(!MUTE);if(MUTE&&SILENT)SILENT.pause();};
/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;TIME+=dt;
  cam.p.lerp(cam.tp,Math.min(1,dt*cam.k));cam.l.lerp(cam.tl,Math.min(1,dt*cam.k*1.2));
  camera.position.set(cam.p.x+Math.sin(TIME*.31)*.05,cam.p.y+Math.sin(TIME*.47)*.04,cam.p.z);camera.lookAt(cam.l);camera.updateMatrixWorld();
  sky.position.copy(camera.position);skyU.uLight.value+=(skyT-skyU.uLight.value)*Math.min(1,dt*1.4);
  dust.obj.rotation.y+=dt*.006;clouds.obj.rotation.y+=dt*.02;
  for(const it of items){if(it.home==='tray')it.g.tp=trayPos(it.i);else if(it.home==='pocket')it.g.tp=trayPos(2).add(new V3(0,-slotSize()*.95,0));}
  for(const g of ALL){if(g.spin)g.obj.rotation.y=Math.sin(TIME*.6)*.55;if(g.bob!=null)g.obj.position.y=(g.tp?g.tp.y:0)+.05+Math.sin(TIME*1.6+g.bob)*.05;g.update(dt);}
  for(const f of follows){const p=scr(f.obj);f.el.style.left=p.x+'px';f.el.style.top=(f.el.dataset.below?p.y+22:p.y+f.dy)+'px';f.el.style.display=p.z>1?'none':'';}
  renderer.render(scene,camera);requestAnimationFrame(loop);}
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();SCALE=H*DPR/(2*Math.tan(FOV*Math.PI/360));ALL.forEach(g=>g.u.uScale.value=SCALE);
  slots.forEach((s,i)=>{s.obj.position.copy(trayPos(i));s.obj.scale.setScalar(slotSize());});});
camera.position.copy(cam.p);camera.lookAt(cam.l);
requestAnimationFrame(loop);boot();
})();
